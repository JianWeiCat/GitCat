[package]
name = "git-helper"
version = "0.1.0"
description = "Git Helper - 纯 Rust 跨平台 Git 仓库增强桌面工具箱"
authors = ["JianWeiCat"]
license = "MIT OR Apache-2.0"
repository = "https://github.com/JianWeiCat/Git-Helper"
edition = "2021"
rust-version = "1.85"

[lib]
name = "app_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
# Tauri
tauri = { version = "2", features = [] }
tauri-plugin-log = "2"
tauri-plugin-shell = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
log = "0.4"

# File system
walkdir = "2"

# Concurrency
rayon = "1"

# Serialization
csv = "1"
toml = "0.8"

# Error handling
thiserror = "2"

# Config & data dirs
dirs = "5"

# DateTime
time = { version = "0.3", features = ["formatting", "macros"] }

# Regex
regex = "1"

# UUID
uuid = { version = "1", features = ["v4"] }

[profile.release]
opt-level = 3
lto = "fat"
codegen-units = 1
strip = true
panic = "abort"
