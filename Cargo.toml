[package]
name = "git-helper"
version = "0.1.0"
edition = "2021"
rust-version = "1.85"
description = "纯 Rust 跨平台 Git 仓库增强工具箱"
license = "MIT OR Apache-2.0"
repository = "https://github.com/JianWeiCat/Git-Helper"
readme = "README.md"

[[bin]]
name = "gh"
path = "src/main.rs"

[dependencies]
# CLI
clap = { version = "4", features = ["derive", "env", "wrap_help"] }
clap_complete = "4"

# Git backend (纯 Rust)
gix = { version = "0.70", features = ["blob-diff", "revision"] }
gix-filter = "0.16"

# File system
walkdir = "2"

# Concurrency
rayon = "1"

# Terminal UI
indicatif = "0.17"
console = "0.15"
colored = "2"
tabled = "0.17"

# Serialization
serde = { version = "1", features = ["derive"] }
serde_json = "1"
csv = "1"
toml = "0.8"

# Error handling
thiserror = "2"
miette = { version = "7", features = ["fancy"] }

# Logging
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter", "json"] }

# Config & data dirs
dirs = "5"

# DateTime
time = { version = "0.3", features = ["formatting", "macros"] }

# Regex
regex = "1"

# UUID for audit log entries
uuid = { version = "1", features = ["v4"] }

[dev-dependencies]
tempfile = "3"
assert_cmd = "2"
predicates = "3"

[profile.release]
opt-level = 3
lto = "fat"
codegen-units = 1
strip = true
panic = "abort"

[features]
default = ["tui-progress", "color"]
tui-progress = ["indicatif", "console"]
color = ["colored", "tabled/color"]
remote = []
audit-log = []
